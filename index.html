<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4ecd9">
  <title>Ryan</title>
  <style>

    @font-face {
      font-family: "RyanCardTypewriter";
      src: url(data:font/otf;base64,T1RUTwANAIAAAwBQQ0ZGIPOmQUkAABg8AACCWUZGVE150e4tAACrsAAAABxHREVGDq8P2wAAmpgAAAB0R1BPU4CWYp4AAKdgAAAEUEdTVULcAiAmAACbDAAADFJPUy8yefUt1QAAAUAAAABgY21hcML+0SwAABU0AAAC[...]
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    :root {
      --cream: #f4ecd9;
      --cream-2: #efe3c9;
      --ink: #171512;
      --gold: #bc9139;
      --gold-dark: #997124;
      --max-width: 430px;
    }

    * { box-sizing: border-box; }

    html {
      background: var(--cream);
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 22% 8%, rgba(255,255,255,.38), transparent 32%),
        linear-gradient(rgba(93,66,28,.022) 1px, transparent 1px),
        var(--cream);
      background-size: auto, 100% 5px, auto;
    }

    .page {
      width: min(100%, var(--max-width));
      margin: 0 auto;
      padding: 18px 20px 0;
      text-align: center;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .name {
      margin: 0;
      font-family: "RyanCardTypewriter", "Courier New", Courier, monospace;
      font-size: clamp(2.5rem, 14vw, 4.7rem);
      line-height: .92;
      font-weight: 400;
      letter-spacing: .035em;
      text-shadow: .25px 0 0 rgba(23,21,18,.35);
    }

    .name-rule {
      width: 120px;
      height: 4px;
      margin: 10px auto 16px;
      background: var(--gold);
      transform: rotate(-.8deg);
    }

    .photo-wrap {
      width: min(84vw, 280px);
      margin: 0 auto 16px;
      filter: drop-shadow(0 6px 9px rgba(26,22,14,.15));
      flex-shrink: 0;
    }

    .photo {
      display: block;
      width: 100%;
      height: auto;
      clip-path: polygon(
        2% 1%, 7% 2%, 12% .6%, 18% 1.7%, 24% .4%, 30% 1.5%, 37% .3%,
        44% 1.3%, 51% .6%, 58% 1.8%, 65% .4%, 72% 1.5%, 79% .4%, 86% 1.6%, 94% .7%, 99% 2%,
        98.8% 9%, 99.5% 17%, 98.7% 25%, 99.4% 34%, 98.8% 43%, 99.4% 52%, 98.6% 61%, 99.5% 70%, 98.8% 79%, 99.4% 88%, 98.4% 98%,
        92% 99.1%, 85% 98.5%, 78% 99.4%, 71% 98.6%, 64% 99.3%, 57% 98.4%, 50% 99.5%, 43% 98.5%, 36% 99.3%, 29% 98.7%, 22% 99.4%, 15% 98.5%, 8% 99.3%, 1.4% 97.8%,
        2% 90%, .7% 81%, 1.6% 72%, .7% 63%, 1.5% 54%, .5% 45%, 1.4% 36%, .7% 27%, 1.6% 18%, .6% 9%
      );
    }

    .links {
      display: grid;
      gap: 8px;
      width: 86%;
      margin: 0 auto;
      flex-grow: 1;
      padding-bottom: 12px;
    }

    .link-button {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      padding: 8px 16px;
      border: 2px solid var(--ink);
      border-radius: 2px;
      background: rgba(248,241,224,.76);
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: .02em;
      box-shadow: 3px 3px 0 var(--gold);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
      font-size: 0.9rem;
    }

    .link-button:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--gold);
      background: var(--cream-2);
    }

    @media (hover:hover) and (pointer:fine) {
      .link-button:hover {
        transform: translate(-1px, -1px);
        box-shadow: 4px 4px 0 var(--gold);
        background: #f8f1e0;
      }
    }

    .icon {
      width: 26px;
      height: 26px;
      flex: 0 0 26px;
      color: var(--gold-dark);
    }

    .label {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      line-height: 1.03;
    }

    .label-main {
      font-size: .98rem;
      text-transform: uppercase;
    }

    .label-sub {
      margin-top: 3px;
      font-size: .76rem;
      font-weight: 400;
      opacity: .72;
      letter-spacing: 0;
    }

    .city-wrap {
      width: calc(100% + 40px);
      margin-left: -20px;
      margin-top: 12px;
      line-height: 0;
      flex-shrink: 0;
    }

    .city {
      display: block;
      width: 100%;
      height: auto;
      opacity: .98;
    }

    @media (min-width: 700px) {
      .page { padding-top: 42px; }
      .photo-wrap { width: 340px; }
      .links { width: 82%; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="name">RYAN</h1>
    <div class="name-rule" aria-hidden="true"></div>

    <div class="photo-wrap">
      <img class="photo"
           src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQEASABIAAD/4QR2RXhpZgAATU0AKgAAAAgABQEPAAIAAAAGAAABVgEQAAIAAAAOAAABXIdpAAQAAAABAAABaoglAAQAAAABAAAEBuocAAcAAAEMAAAASgAAAAAc6gAAAAEAAAAAAAAAAAAAA[...]
           alt="Profile photo">
    </div>

    <div class="links">
      <!-- Link buttons go here -->
    </div>

    <div class="city-wrap">
      <svg class="city" viewBox="0 0 430 80" xmlns="http://www.w3.org/2000/svg">
        <!-- City SVG content would go here -->
      </svg>
    </div>
  </main>
</body>
</html>
